name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'release/**'
      - 'release-*'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Shell and QML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q config/quickshell/Scripts

      - name: Bash syntax
        run: |
          bash -n config/bspwm/default/quickshell.sh config/quickshell/Scripts/system/*.sh PKGBUILD PKGBUILD.stable

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error config/bspwm/default/quickshell.sh config/quickshell/Scripts/system/*.sh
