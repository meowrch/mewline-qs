# picom rules for mewline-qs windows (X11/bspwm build).
# include-file from your picom.conf. The shell draws its own shadows and
# handles transparency, so picom must not double-process its windows, and
# the frame radius must match the Hyprland build (32) — shell windows are
# dock type, which the usual rounded-corners-exclude skips.

matched = "class_g = 'quickshell'";
shadow = false;
fade = false;
animations = false;

# Frame radius matches the Hyprland build (32). Static shell surfaces are
# tagged "mewline-*" by the autostart module, dynamic sheets keep the
# default "quickshell" name, the settings window is "Mewline Settings".
corner-radius-rules = [
  "32:name *= 'mewline-'",
  "32:name *?= 'mewline '",
  "32:name *= 'quickshell'"
];
